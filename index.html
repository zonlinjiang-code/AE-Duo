/* v3: stable icon alignment, preview switches and paired shortcut rows. */
.group-button .group-count{line-height:16px;display:flex;align-items:center;justify-content:flex-end;min-width:18px;font-variant-numeric:tabular-nums}
.chevron{display:grid;place-items:center;flex:0 0 16px;width:16px;height:16px;line-height:0;transform-origin:50% 50%}
.group-button .chevron .icon{display:block;width:14px;height:14px;margin:0}
.demo-switch{display:flex;gap:5px;padding:10px 15px;border-bottom:1px solid var(--line-soft);background:#1c1d24}
.demo-switch button{font-size:12px;color:var(--muted);padding:5px 13px;border-radius:5px;border:1px solid transparent}
.demo-switch button:hover{color:var(--text);background:#292731}
.demo-switch button[aria-pressed=true]{background:var(--accent-bg);border-color:#514462;color:#d3c0ff}
.target-handle{cursor:grab;outline:none}.target-handle:active{cursor:grabbing}.target-handle:focus-visible .target-ring,.target-handle:hover .target-ring{stroke:#fff;stroke-width:2.5}
.shortcut-section{max-width:1120px}.shortcut-list{gap:8px 14px}

.key-row:hover{border-color:#45414f;background:#23232c}.key-description{min-width:0;flex:0 1 auto;line-height:1.6}
.key-combo{flex:0 0 auto;justify-content:flex-start;max-width:55%;gap:4px}

<script>const originalDB = {"expressions":[{"id":"basics","category":"🔰 入门必备","items":[{"name":"value","tag":"保留关键帧","target":"任意数值属性","demo":"value","desc":"读取当前属性原本的值。给有关键帧的属性叠加效果时，先从它开始理解。","setup":"直接贴到你想保留原动画的属性上。","detail":"value 不会让关键帧失效；它代表表达式所在属性在当前时间的原始值。","code":"value;"},{"name":"wiggle(freq, amp)","tag":"自然抖动","target":"Position / Scale / Rotation","demo":"wiggle","desc":"给画面加入可控的随机抖动，适合手持、震动、故障和轻微呼吸感。","setup":"选中属性，Alt/Option 点击秒表，直接粘贴。无需关键帧。","detail":"freq 是每秒抖动次数；amp 是属性单位里的幅度。位置的 amp 是像素，旋转的 amp 是度数。","code":"wiggle(4, 30);"},{"name":"time","tag":"持续运动","target":"Rotation / 旋转","demo":"time","desc":"把时间变成不断增加的数值，最适合制作无限旋转和循环移动。","setup":"贴到 Rotation / 旋转。想改变速度，修改 45。","detail":"time 的单位是秒；time * 45 就是每秒旋转 45 度。","code":"time * 45;"},{"name":"正弦悬浮（Math.sin）","tag":"平滑往复","target":"Position / 位置","demo":"sin","desc":"让图层沿 Y 轴平滑上下漂浮，适合卡片、图标、气泡和科技 UI。","setup":"贴到 Position / 位置；value 保留原来的 X 和基础位置。","detail":"2 * Math.PI * 0.8 表示每秒 0.8 个完整周期；40 是上下浮动的像素幅度。","code":"amplitude = 40;\nfrequency = 0.8;\ny = Math.sin(time * 2 * Math.PI * frequency) * amplitude;\nvalue + [0, y];"}]},{"id":"motion","category":"🌀 运动与弹性","items":[{"name":"linear() 线性映射","tag":"万能映射","target":"Opacity / Rotation / Slider","demo":"linear","desc":"把一个输入范围换算成另一个输出范围，适合把控制器、时间或音量转成动画。","setup":"直接贴到目标数值属性；修改 start、end、duration。","detail":"这里的 t 被限制在 0 到 duration 之间，所以动画结束后会停在 end。","code":"start = 0;\nend = 100;\nduration = 2;\nt = clamp(time - inPoint, 0, duration);\nlinear(t, 0, duration, start, end);"},{"name":"ease() 平滑映射","tag":"缓入缓出","target":"Opacity / Position / Rotation","demo":"ease","desc":"和 linear 用法相同，但起步和收尾更柔和，适合标题、卡片和 UI 动效。","setup":"直接贴到目标数值属性；需要更快或更慢时修改 duration。","detail":"ease 只改变数值曲线，不会自动改变动画总时长。","code":"start = 0;\nend = 100;\nduration = 2;\nt = clamp(time - inPoint, 0, duration);\nease(t, 0, duration, start, end);"},{"name":"弹性回弹（Keyframe Overshoot）","tag":"关键帧增强","target":"Position / Scale / Rotation","demo":"elastic","desc":"在最后一个关键帧之后加入带衰减的弹性回弹，适用于位置、缩放、旋转等属性。","setup":"先设置起始和结束关键帧，再把表达式贴到同一属性。","detail":"amp 控制振幅，freq 控制每秒次数，decay 控制衰减速度。","code":"amp=0.2;  //弹的振幅，成正比\nfreq=2;  //弹的频率，次数 / 秒\ndecay=4;  //弹性衰减，成反比\nn=numKeys;  //关键帧数量\nif(n==0){value;}\nelse{\nt=time-key(n).time;\nif(t>0){v=velocityAtTime(key(n).time-thisComp.frameDuration/10);\nvalue+v*amp*Math.sin(freq*2*Math.PI*t)/Math.exp(decay*t);}\nelse{value;}\n}"}]},{"id":"time","category":"⏱ 时间与循环","items":[{"name":"loopOut() 关键帧循环","tag":"循环动画","target":"有关键帧的任意属性","demo":"loop","desc":"让已有关键帧持续循环，适合旋转、呼吸、进度条和重复位移。","setup":"先打好关键帧，再把表达式贴到同一属性。","detail":"cycle 是从头到尾重复；pingpong 是正向到反向往返。只保留一行即可。","code":"loopOut(\"cycle\");\n// 往返循环：loopOut(\"pingpong\");"},{"name":"posterizeTime() 定格采样","tag":"逐格感","target":"任意动画属性","demo":"posterize","desc":"降低某个属性的更新帧率，做出定格、跳格和手工拍摄的节奏。","setup":"把它放在表达式第一行；把 12 改成想要的更新帧率。","detail":"posterizeTime 会限制后面表达式的采样频率；它不改变合成的实际帧率。","code":"posterizeTime(12);\nvalue;"},{"name":"timeToCurrentFormat() 时间码","tag":"时间显示","target":"Source Text / 源文本","demo":"timecode","desc":"让文本图层显示与项目设置一致的当前时间码，避免手动计算 23.976、29.97 等帧率。","setup":"新建文本图层，在 Source Text / 源文本上粘贴。","detail":"它会读取当前项目的时间显示格式和帧率。","code":"timeToCurrentFormat();"}]},{"id":"follow","category":"🧲 图层跟随与链接","items":[{"name":"lookAt(fromPoint, atPoint)","tag":"3D朝向","target":"Orientation / 方向","demo":"lookAt","desc":"让一个图层（通常是3D层）始终面朝另一个图层。","setup":"应用在方向（Orientation）属性。","detail":"自动计算旋转角度。","code":"lookAt(position, thisComp.layer('Camera 1').position)"},{"name":"距离映射到 Scale","tag":"空间关系","target":"Scale / 缩放","demo":"distance","desc":"读取当前图层和 TARGET 的合成空间距离，再把距离映射成可控的缩放。","setup":"新建一个名为 TARGET 的图层；把代码贴到需要缩放的图层 Scale。","detail":"使用 toComp() 后，即使图层有父级或变换，测量仍然更接近画面中的真实距离。","code":"a = thisLayer.toComp(thisLayer.anchorPoint);\nb = thisComp.layer(\"TARGET\").toComp(thisComp.layer(\"TARGET\").anchorPoint);\nd = length(a, b);\ns = linear(d, 0, 800, 60, 140);\n[s, s];"}]},{"id":"text","category":"📝 文本与自适应 UI","items":[{"name":"打字机（Typewriter）","tag":"逐字出现","target":"Source Text / 源文本","demo":"typewriter","desc":"按每秒字符数逐字显示文本，适合标题、字幕、终端和产品 UI。","setup":"在文本图层 Source Text / 源文本 上粘贴；直接修改 speed。","detail":"文本内容来自该图层原本的文字，所以改文字时不需要修改表达式。","code":"txt = value.toString();\nspeed = 12;\nelapsed = Math.max(0, time - inPoint);\ncount = Math.min(txt.length, Math.floor(elapsed * speed));\ntxt.substring(0, count);"},{"name":"打字机 + 光标","tag":"单层完成","target":"Source Text / 源文本","demo":"cursor","desc":"逐字显示文本，并在输入期间显示闪烁的 ASCII 光标，方便直接复制使用。","setup":"在文本图层 Source Text / 源文本 上粘贴；speed、blinkSpeed、startDelay、endDelay 都可改。","detail":"光标使用半角 |，避免不同字体对特殊竖线字符的支持差异；需要时可替换成其他字符。","code":"txt = value.toString();\nspeed = 20;\nblinkSpeed = 2;\nstartDelay = 0.4;\nendDelay = 0.5;\n\nelapsed = Math.max(0, time - inPoint);\ntypingTime = Math.max(0, elapsed - startDelay);\ncount = Math.min(txt.length, Math.floor(typingTime * speed));\ntypingDuration = txt.length / speed;\nshowCursor = typingTime - typingDuration < endDelay;\n\nif (showCursor) {\n    blink = Math.floor(elapsed * blinkSpeed * 2) % 2 == 0;\n    cursor = blink ? \"|\" : \" \";\n} else {\n    cursor = \"\";\n}\n\ntxt.substring(0, count) + cursor;"},{"name":"数字增长（Count Up）","tag":"数据动画","target":"Source Text / 源文本","demo":"counter","desc":"把数字从起始值平滑增长到结束值，适合金额、进度和数据看板。","setup":"在文本图层 Source Text / 源文本 上粘贴；修改 start、end、duration。","detail":"Math.round 用来显示整数；如果需要小数，可改成 Math.round(number * 10) / 10。","code":"start = 0;\nend = 1000;\nduration = 2;\nt = clamp(time - inPoint, 0, duration);\nMath.round(linear(t, 0, duration, start, end)).toString();"},{"name":"数字增长 + 千位逗号","tag":"格式化数据","target":"Source Text / 源文本","demo":"counter-format","desc":"在数字增长的同时自动添加千位逗号，适合金额、播放量和大数值指标。","setup":"在文本图层 Source Text / 源文本 上粘贴；修改 start、end、duration。","detail":"最后一行只负责显示格式。","code":"start = 0;\nend = 128000;\nduration = 2;\nt = clamp(time - inPoint, 0, duration);\nnum = Math.round(linear(t, 0, duration, start, end));\nnum.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \",\");"}]},{"id":"random","category":"🎲 随机与闪烁","items":[{"name":"随机位置（可复现）","tag":"随机布局","target":"Position / 位置","demo":"random","desc":"为图层生成稳定的随机偏移；同一时间渲染不会因为重新打开项目而乱跳。","setup":"贴到 Position；想换一组随机结果，修改 seedRandom 的数字。","detail":"timeless=true 让随机值不随时间变化，适合散点布局和海报构图。","code":"seedRandom(123, true);\nvalue + [random(-100, 100), random(-60, 60)];"},{"name":"随机闪烁 Opacity","tag":"故障 / 灯光","target":"Opacity / 不透明度","demo":"blink","desc":"以固定的 12 fps 随机改变透明度，适合信号灯、屏幕噪声和轻微故障。","setup":"贴到 Opacity / 不透明度；修改 fps 和 minOpacity。","detail":"seedRandom 的时间种子让每个采样点稳定；posterizeTime 控制闪烁更新频率。","code":"fps = 12;\nminOpacity = 35;\nposterizeTime(fps);\nseedRandom(index + Math.floor(time * fps), true);\nrandom(minOpacity, 100);"},{"name":"随机颜色","tag":"颜色变化","target":"Fill Color / 填充颜色","demo":"color","desc":"生成每个图层各不相同、并按节奏变化的 RGB 颜色。","setup":"贴到 Fill Color / 填充颜色或文字 Fill Color；想固定颜色，把 time * 6 改成 0。","detail":"AE 颜色值是 0 到 1；最后的 1 代表完全不透明。","code":"seedRandom(index + Math.floor(time * 6), true);\n[random(), random(), random(), 1];"}]},{"id":"audio","category":"🎧 音频与控制器","items":[{"name":"音频振幅驱动 Scale","tag":"音乐可视化","target":"Scale / 缩放","demo":"audio","desc":"把音频振幅转换成图层缩放，快速制作节拍图形、Logo 呼吸和音乐海报。","setup":"Animation > Keyframe Assistant > Convert Audio to Keyframes；把生成层命名为 Audio Amplitude。","detail":"0 和 30 是输入音量范围，100 和 180 是缩放范围；不同音乐需要重新调整输入上限。","code":"audio = thisComp.layer(\"Audio Amplitude\").effect(\"Both Channels\")(\"Slider\");\ns = linear(audio, 0, 30, 100, 180);\n[s, s];"},{"name":"Slider 控制 Rotation","tag":"控制器映射","target":"Rotation / 旋转","demo":"control","desc":"用一个 Slider Control / 滑块控制器驱动另一个属性，适合做可交付的模板控件。","setup":"在图层上添加 Slider Control / 滑块控制；把代码贴到 Rotation。","detail":"最稳的做法是用 pick whip 自动生成 effect 引用；示例中的 0、100、360 可以按设计需要修改。","code":"ctrl = effect(\"Slider Control\")(\"Slider\");\nease(ctrl, 0, 100, 0, 360);"}]},{"id":"path","category":"🧬 路径与高级 Rig","items":[{"name":"3 个 Null 控制平滑路径","tag":"高级路径","target":"Shape Path / 路径","demo":"path","desc":"用 P1、P2、P3 三个 Null 控制路径锚点，并自动重算平滑 Bezier 手柄。","setup":"在合成中建立 3 个 Null，命名 P1、P2、P3；把表达式贴到形状层 Path / 路径。","detail":"Position 控制锚点位置；路径保持开放，端点不拉出多余手柄。更多点时复制循环并保持命名顺序。","code":"points = [];\nfor (i = 1; i <= 3; i++) {\n    c = thisComp.layer(\"P\" + i);\n    points.push(fromComp(c.toComp(c.anchorPoint)));\n}\n\ninTangents = [];\noutTangents = [];\nratio = 0.333;\nlast = points.length - 1;\n\nfor (i = 0; i < points.length; i++) {\n    prev = i == 0 ? points[i] : points[i - 1];\n    next = i == last ? points[i] : points[i + 1];\n    direction = normalize(next - prev);\n    prevDistance = i == 0 ? length(points[i], next) : length(points[i], prev);\n    nextDistance = i == last ? length(points[i], prev) : length(points[i], next);\n    handle = Math.min(prevDistance, nextDistance) * ratio;\n    inTangents.push(i == 0 ? [0, 0] : -direction * handle);\n    outTangents.push(i == last ? [0, 0] : direction * handle);\n}\n\ncreatePath(points, inTangents, outTangents, false);"}]}],"shortcuts":[{"category":"工具箱","list":[{"key":"V","desc":"选取工具"},{"key":"H","desc":"抓手工具（按住 Space 临时切换）"},{"key":"Z","desc":"缩放工具"},{"key":"W","desc":"旋转工具"},{"key":"G","desc":"钢笔工具"},{"key":"C","desc":"摄像机工具组"},{"key":"Y","desc":"锚点移动工具"},{"key":"Ctrl + T","desc":"文字工具"}]},{"category":"图层属性（核心）","list":[{"key":"A","desc":"显示锚点 Anchor Point"},{"key":"P","desc":"显示位置 Position"},{"key":"S","desc":"显示缩放 Scale"},{"key":"R","desc":"显示旋转 Rotation"},{"key":"T","desc":"显示不透明度 Opacity"},{"key":"U","desc":"显示有关键帧的属性"},{"key":"UU","desc":"显示所有被修改过的属性"},{"key":"E","desc":"显示特效 Effects"},{"key":"M","desc":"显示蒙版 Masks"},{"key":"F","desc":"显示蒙版羽化"}]},{"category":"编辑与图层","list":[{"key":"Ctrl + Z","desc":"撤销"},{"key":"Ctrl + Shift + Z","desc":"重做"},{"key":"Ctrl + C","desc":"复制"},{"key":"Ctrl + V","desc":"粘贴"},{"key":"Ctrl + X","desc":"剪切"},{"key":"Ctrl + D","desc":"复制图层"},{"key":"Ctrl + Shift + D","desc":"分割图层"},{"key":"Ctrl + Shift + C","desc":"从选中图层预合成"}]},{"category":"动画与关键帧","list":[{"key":"F9","desc":"Easy Ease 缓动"},{"key":"Shift + F9","desc":"Easy Ease In 缓入"},{"key":"Ctrl + Shift + F9","desc":"Easy Ease Out 缓出"},{"key":"Ctrl + Shift + ← / →","desc":"选中的关键帧移动 10 帧"},{"key":"Alt + ← / →","desc":"选中的关键帧移动 1 帧"},{"key":"Alt + 拖拽关键帧","desc":"整体拉伸或压缩关键帧间距"},{"key":"*","desc":"添加图层标记"}]},{"category":"时间轴操作","list":[{"key":"B / N","desc":"设置工作区入点 / 出点"},{"key":"Home / End","desc":"跳到时间轴开头 / 结尾"},{"key":"Page Up / Down","desc":"上一帧 / 下一帧"},{"key":"J / K","desc":"跳到上一 / 下一关键帧"},{"key":"[ / ]","desc":"图层入点 / 出点对齐当前时间"},{"key":"Alt + [ / ]","desc":"修剪图层入点 / 出点"}]},{"category":"合成与面板","list":[{"key":"Ctrl + N","desc":"新建合成"},{"key":"Ctrl + K","desc":"合成设置"},{"key":"Ctrl + M","desc":"添加至渲染队列"},{"key":"Ctrl + Y","desc":"新建固态层"},{"key":"Ctrl + Alt + Y","desc":"新建调整图层"},{"key":"Ctrl + Shift + Alt + Y","desc":"新建空对象"},{"key":"Ctrl + Alt + '","desc":"打开键盘快捷键编辑器"}]},{"category":"预览与视图","list":[{"key":"Space","desc":"播放 / 停止预览"},{"key":"0（小键盘）","desc":"RAM 预览"},{"key":"Shift + /","desc":"视图适应窗口"},{"key":"Ctrl + R","desc":"显示 / 隐藏标尺"},{"key":"Ctrl + '","desc":"显示 / 隐藏网格"},{"key":"`","desc":"最大化当前面板"},{"key":"Caps Lock","desc":"暂停画面刷新"}]}]};
const range = (key,label,value,min,max,step=1,unit='',explain='') => ({key,label,value,min,max,step,unit,explain,type:'range'});
const choice = (key,label,value,options,explain='') => ({key,label,value,options,explain,type:'select'});
const textParam = (key,label,value,explain='') => ({key,label,value,explain,type:'text'});
const durationParam = (value=2) => range('duration','动画时长',value,.5,6,.1,'s','从图层入点开始计算，结束后保持最终值。');
const recipesById = Object.fromEntries(originalDB.expressions.flatMap(c=>c.items).map(x=>[x.demo,{...x,id:x.demo,params:[],needs:'无需关键帧',note:'预览重播仅用于观察，不会给表达式额外添加循环。'}]));
function recipe(id,values){Object.assign(recipesById[id] ||= {id,params:[]},values)}
recipe('value',{
 title:'保留原始值',fn:'value',short:'value',desc:'读取属性原本的值。有关键帧时，表达式会完整保留原动画。',target:'Position · 2D 位置',
 params:[range('travel','移动距离',180,0,260,10,'px','这是预览中原关键帧的移动距离，不写入表达式。')],
 setup:['在位置属性上设置两个不同数值的关键帧。','Alt / Option 点击位置秒表，粘贴表达式。'],
 code:()=>`value;`,note:'两行使用相同关键帧。调整移动距离只改变示例关键帧，不改变代码。',duration:()=>4

function highlight(code){
 const rx=/(\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\b(?:if|else|for|true|false|var|const|let)\b|\b[A-Za-z_$][\w$]*(?=\s*\())/g;
 let cursor=0,result='';
 for(const m of code.matchAll(rx)){
  result+=escapeHTML(code.slice(cursor,m.index));const t=m[0];
  const cls=t.startsWith('//')?'comment':/^['"]/.test(t)?'string':/^\d/.test(t)?'number':/^(if|else|for|true|false|var|const|let)$/.test(t)?'key':'fn';
  result+=`<span class="token-${cls}">${escapeHTML(t)}</span>`;cursor=m.index+t.length;
 }return result+escapeHTML(code.slice(cursor));
}

function tick(now){
 if(state.current==='audio'&&mic.mode!=='simulated'&&mic.status!=='live')return;
 if(state.mode!=='exp'||(!state.playing&&mic.status!=='live')||document.hidden)return;
 if(mic.status==='live')sampleMicrophone(state.last?Math.min((now-state.last)/1000,.1):1/60);
 if(state.current==='follow')advanceFollow(state.last?Math.min((now-state.last)/1000,.1):0);

function onParameter(input){
 const p=current().params.find(p=>p.key===input.dataset.param);if(!p)return;
 let value=input.value;
 if(p.type==='range'){if(value===''||!Number.isFinite(Number(value)))return;value=Math.max(p.min,Math.min(p.max,Number(value)));value=Number((Math.round((value-p.min)/p.step)*p.step+p.min).toFixed(4));}
 if(p.key==='fps'&&current().id==='timecode')value=Number(value);
 params()[p.key]=value;
 if(p.key==='cursorChar'){state.time=0;state.last=0}
 syncVariants();
 if(state.current==='time')document.querySelector('.function-name').textContent='time × '+params().speed;
 document.querySelectorAll('[data-param="'+p.key+'"]').forEach(el=>{if(el!==input)el.value=value;if(el.type==='range')el.style.setProperty('--fill',(value-p.min)/(p.max-p.min)*100+'%')});

function action(name){

 if(name==='follow-auto'){resetFollow();state.playing=true;schedule();drawScene();return}
 if(name==='calibrate'){calibrateMicrophone();return}

 if(name==='stop-mic'){stopMicrophone();syncAudioUI();drawScene();return}
 if(name==='simulate'){stopMicrophone();mic.mode='simulated';mic.message='模拟演示 · 不读取麦克风。点击“启用麦克风”切换到实时收音。';state.playing=true;syncAudioUI();drawScene();schedule();return}

 if(name==='prev'||name==='next'){const list=matchingRecipes(),i=list.findIndex(r=>r.id===state.current);const r=list[i+(name==='next'?1:-1)];if(r)selectRecipe(r.id);return}
 if(name==='reset'){if(state.current==='follow')resetFollow();if(state.current==='audio')stopMicrophone();state.params[state.current]=Object.fromEntries(current().params.map(p=>[p.key,p.value]));state.path=[[100,225],[300,105],[500,225]];state.time=0;renderRecipe();toast('已恢复本条表达式的默认参数');return}

 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
 document.querySelector('.mode-tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const mode=e.key==='Home'?'exp':e.key==='End'?'keys':state.mode==='exp'?'keys':'exp';setMode(mode);$(mode==='exp'?'tabExp':'tabKeys').focus()}});

 $('main').addEventListener('dblclick',e=>{const input=e.target.closest('input[type="range"]');if(!input)return;e.preventDefault();if(input.id==='timeline'){state.time=0;state.last=0;drawScene();updateTransport();return}resetParameter(input.dataset.param)});

 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sidebar').classList.contains('open')){closeNav();$('openNav').focus()}if(e.key==='Tab'&&$('sidebar').classList.contains('open')){const elements=[...$('sidebar').querySelectorAll('input,button,a')].filter(x=>!x.disabled&&x.getClientRects().length);const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function bindPath(){
 if(state.current!=='path')return;const svg=$('scene');let dragging=-1;
 const coord=e=>{const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;return point.matrixTransform(svg.getScreenCTM().inverse())};
 svg.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-point]');if(!handle)return;dragging=Number(handle.dataset.point);svg.setPointerCapture(e.pointerId);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(dragging<0)return;const p=coord(e);state.path[dragging]=[Math.max(45,Math.min(555,p.x)),Math.max(65,Math.min(285,p.y))];drawScene()});
 const finish=()=>{dragging=-1};svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);
 svg.addEventListener('keydown',e=>{const handle=e.target.closest('[data-point]');if(!handle||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const i=Number(handle.dataset.point),p=state.path[i],step=e.shiftKey?10:2;p[0]=Math.max(45,Math.min(555,p[0]+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0)));p[1]=Math.max(65,Math.min(285,p[1]+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0)));drawScene();svg.querySelector('[data-point="'+i+'"]').focus()});
}
function renderVariants(r){

 return `<div class="demo-switch" role="group" aria-label="演示属性">${variant.options.map(([id,label])=>`<button data-variant="${id}" aria-pressed="${params().previewType===id}">${label}</button>`).join('')}</div>`;

function syncVariants(){document.querySelectorAll('[data-variant]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.variant===params().previewType))}
function resetParameter(key){
 const definition=current().params.find(p=>p.key===key);if(!definition)return;
 onParameter({dataset:{param:key},value:String(definition.value)});
 toast(`${definition.label}已恢复为 ${definition.value}${definition.unit||''}`);

function setTargetCoordinates(x,y){
 let changed=false;
 for(const [key,value] of [['targetX',x],['targetY',y]]){
  const definition=current().params.find(p=>p.key===key),v=Math.round(Math.max(definition.min,Math.min(definition.max,value)));
  if(params()[key]!==v)changed=true;params()[key]=v;document.querySelectorAll('[data-param="'+key+'"]').forEach(input=>{input.value=v;if(input.type==='range')input.style.setProperty('--fill',(v-definition.min)/(definition.max-definition.min)*100+'%')});
 }
 if(changed)drawScene();
}
function bindTarget(){
 if(!['lookAt','distance'].includes(state.current))return;const svg=$('scene');let dragging=false,offset=[0,0];
 const position=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())};
 svg.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-target]'))return;const pt=position(e);offset=[params().targetX-pt.x,params().targetY-pt.y];dragging=true;svg.setPointerCapture(e.pointerId);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!dragging)return;const pt=position(e);setTargetCoordinates(pt.x+offset[0],pt.y+offset[1])});
 const stop=()=>{dragging=false};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',stop);
 svg.addEventListener('keydown',e=>{if(!e.target.closest('[data-target]')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?10:1;setTargetCoordinates(params().targetX+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),params().targetY+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0));svg.querySelector('[data-target]').focus()});
 svg.addEventListener('dblclick',e=>{const pt=position(e);if(!e.target.closest('[data-target]')&&Math.hypot(pt.x-params().targetX,pt.y-params().targetY)>24)return;setTargetCoordinates(current().params.find(p=>p.key==='targetX').value,current().params.find(p=>p.key==='targetY').value);svg.querySelector('[data-target]').focus();toast('目标点已恢复默认位置')});
}

function bindMapping(){
 if(state.current!=='linear')return;const svg=$('scene');let dragging=false,offset=[0,0],origin=[0,0],start=[0,0],axis=null;
 const coord=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
 const set=(x,y)=>{onParameter({dataset:{param:'x'},value:String(x)});onParameter({dataset:{param:'y'},value:String(y)})};
 svg.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-mapping-handle]'))return;const pt=coord(e);offset=[pt.x-(65+params().x*.18),pt.y-(90+params().y*.18)];origin=[params().x,params().y];start=[e.clientX,e.clientY];axis=null;dragging=true;svg.setPointerCapture(e.pointerId);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-start[0],dy=e.clientY-start[1];if(!axis){if(Math.max(Math.abs(dx),Math.abs(dy))<5||Math.abs(dx)===Math.abs(dy))return;axis=Math.abs(dx)>Math.abs(dy)?'x':'y';state.mappingAxis=axis}const pt=coord(e);set(axis==='x'?(pt.x-offset[0]-65)/.18:origin[0],axis==='y'?(pt.y-offset[1]-90)/.18:origin[1])});
 for(const n of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(n,()=>{dragging=false;axis=null;state.mappingAxis=null;drawScene()});
 svg.addEventListener('dblclick',e=>{if(e.target.closest('[data-mapping-handle]')){set(500,500);svg.querySelector('[data-mapping-handle]').focus()}});
 svg.addEventListener('keydown',e=>{if(!e.target.closest('[data-mapping-handle]')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?50:10;set(params().x+(e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0),params().y+(e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0));svg.querySelector('[data-mapping-handle]').focus()});
}

function bindRotationSlider(){
 if(state.current!=='control')return;const svg=$('scene');let dragging=false;
 const coord=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x};
 const set=value=>onParameter({dataset:{param:'R'},value:String(Math.round(Math.max(0,Math.min(100,value))))});
 svg.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-rotation-slider]'))return;dragging=true;svg.setPointerCapture(e.pointerId);set((coord(e)-65)/1.6);e.preventDefault()});

 svg.addEventListener('keydown',e=>{if(!e.target.closest('[data-rotation-slider]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();set(e.key==='Home'?0:e.key==='End'?100:params().R+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?10:1));svg.querySelector('[data-rotation-slider]').focus()});
 svg.addEventListener('dblclick',e=>{if(!e.target.closest('[data-rotation-slider]'))return;resetParameter('R');svg.querySelector('[data-rotation-slider]').focus()});

const clamp01 = x => Math.max(0,Math.min(1,x));
const smooth = x => {x=clamp01(x);return x*x*(3-2*x)};
const mix = (a,b,p) => a+(b-a)*p;

  svg+=`<path data-path="curve" d="${d}" fill="none" stroke="${palette.purple}" stroke-width="3"/>`+points.map((pt,i)=>`<g class="path-handle" data-point="${i}" tabindex="0" role="button" aria-label="控制点 P${i+1}，使用方向键移动" transform="translate(${pt[0]} ${pt[1]})"><circle r="19" fill="transparent"/><circle r="7" fill="${palette.green}" stroke="#202028" stroke-width="2"/>${svgText(0,-21,'P'+(i+1),palette.green,14)}</g>`).join('');
  label='BEZIER / 3 NULLS';value=`手柄比例 ${p.ratio} · 开放路径`;
 }
 return {svg,label,value};
}
function drawScene(){
 const svg=$('scene');if(!svg)return;
 const sceneParams=state.current==='audio'?{...params(),liveMode:mic.mode,liveLevel:mic.level,liveWave:mic.wave,liveBands:mic.bands}:state.current==='linear'?{...params(),mappingAxis:state.mappingAxis}:state.current==='follow'?{...params(),followState:followDemo}:params();
 const result=sceneModel(state.current,sceneParams,state.time,state.path);
 svg.innerHTML=`<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2e2d3b" stroke-width=".65"/></pattern><radialGradient id="stageGlow"><stop stop-color="#a78ad7" stop-opacity=".06"/><stop offset="1" stop-color="#a78ad7" stop-opacity="0"/></radialGradient></defs><rect width="600" height="335" fill="url(#grid)"/><ellipse cx="300" cy="167" rx="240" ry="165" fill="url(#stageGlow)"/>${result.svg}`;
 if(state.current==='text-box')fitTextBackground(svg,params());
 $('readoutLabel').textContent=result.label;$('readoutValue').textContent=result.value;
}

// Microphone stays local: the analyser is never connected to the speakers.
const mic={mode:'simulated',status:'idle',stream:null,context:null,source:null,analyser:null,buffer:null,level:0,wave:[],token:0,message:'可使用麦克风实时收音，或观看模拟演示。'};
Object.assign(mic,{deviceId:'',devices:[],floor:.012,calibration:[],calibrationTime:0,calibrating:false,gate:false});
Object.assign(mic,{spectrum:null,bands:Array(13).fill(0),bandFloor:Array(13).fill(0),bandSum:Array(13).fill(0),bandSamples:0});
function renderAudioControls(){return `<div class="audio-controls"><div class="audio-actions"><button data-action="mic" id="micStart">启用麦克风</button><button data-action="stop-mic" id="micStop" hidden>停止收音</button><button data-action="simulate" id="micSimulate">模拟演示</button><button data-action="calibrate" id="micCalibrate" hidden>校准静音</button></div><label class="mic-device-label" for="micDevice">收音设备 · Input <select id="micDevice"><option value="">系统默认（授权后可选择设备）</option>${mic.devices.map(d=>`<option value="${escapeHTML(d.deviceId)}" ${d.deviceId===mic.deviceId?'selected':''}>${escapeHTML(d.label||'麦克风')}</option>`).join('')}</select></label><p id="micStatus" role="status"></p></div>`}
function syncAudioUI(){
 if(state.current!=='audio'||!$('micStatus'))return;
 $('micStatus').textContent=mic.message;$('micStart').disabled=['pending','live'].includes(mic.status);$('micStart').textContent=mic.status==='pending'?'等待麦克风授权…':'启用麦克风';$('micStop').hidden=!['pending','live'].includes(mic.status);
 $('micSimulate').setAttribute('aria-pressed',mic.mode==='simulated');
 if($('micCalibrate')){$('micCalibrate').hidden=mic.status!=='live';$('micCalibrate').disabled=mic.calibrating}
 if($('micDevice'))$('micDevice').disabled=mic.status==='pending';
 const transport=document.querySelector('.transport');if(transport)transport.hidden=mic.mode!=='simulated';
 if(mic.mode!=='simulated')$('playStatus').innerHTML='<i></i>'+({live:'实时收音',pending:'等待授权',error:'收音未开启',idle:'已停止'}[mic.status]);
}
function stopMicrophone(message='已停止收音。点击“启用麦克风”重新开始。'){
 ++mic.token;const active=mic.status==='live'||mic.status==='pending';
 if(mic.stream)mic.stream.getTracks().forEach(track=>track.stop());
 if(mic.source)try{mic.source.disconnect()}catch{}
 if(mic.context)mic.context.close().catch(()=>{});
 mic.stream=null;mic.source=null;mic.context=null;mic.analyser=null;mic.buffer=null;mic.level=0;mic.wave=[];mic.status='idle';
 mic.calibrating=false;mic.calibration=[];mic.gate=false;
 mic.spectrum=null;mic.bands.fill(0);mic.bandFloor.fill(0);
 if(active||mic.mode!=='simulated'){mic.mode='input';mic.message=message}
}
async function startMicrophone(){
 stopMicrophone();mic.mode='input';mic.status='pending';mic.message='请在浏览器中允许使用麦克风。声音仅用于本页实时预览。';syncAudioUI();drawScene();
 const token=mic.token;
 let context=null,stream=null;
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Object.assign(new Error(),{name:'UnsupportedError'});
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw Object.assign(new Error(),{name:'UnsupportedError'});
  context=new AudioContextClass();mic.context=context;
  await context.resume();
  if(token!==mic.token)return;
  stream=await navigator.mediaDevices.getUserMedia({audio:{...(mic.deviceId?{deviceId:{exact:mic.deviceId}}:{}),echoCancellation:true,noiseSuppression:true,autoGainControl:false},video:false});
  if(token!==mic.token||state.current!=='audio'||state.mode!=='exp'||document.hidden){stream.getTracks().forEach(track=>track.stop());await context.close().catch(()=>{});return}
  const analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.5;
  mic.spectrum=new Uint8Array(analyser.frequencyBinCount||1024);
  const source=context.createMediaStreamSource(stream);source.connect(analyser);
  Object.assign(mic,{stream,context,source,analyser,buffer:new Float32Array(analyser.fftSize),status:'live',message:'正在收音 · '+(stream.getAudioTracks()[0]?.label||'默认麦克风')+' · 不录制、不上传'});
  stream.getAudioTracks().forEach(track=>track.addEventListener('ended',()=>{if(token!==mic.token)return;stopMicrophone('输入设备已断开，请重新启用麦克风。');syncAudioUI();drawScene()}));
  state.playing=true;mic.floor=.012;calibrateMicrophone();schedule();
  refreshMicrophoneDevices(token);
 }catch(error){
  if(stream)stream.getTracks().forEach(track=>track.stop());if(context)await context.close().catch(()=>{});
  if(token!==mic.token)return;
  stopMicrophone();mic.mode='input';mic.status='error';
  const messages={NotAllowedError:'麦克风未获授权。请在浏览器地址栏的权限设置中允许麦克风，然后重试。',NotFoundError:'未找到收音设备，请连接麦克风后重试。',NotReadableError:'无法读取收音设备，请检查设备是否被其他程序占用。',UnsupportedError:'当前浏览器不支持收音。请用 Chrome 或 Edge 打开本地 HTML，或通过 localhost / HTTPS 打开。'};
  mic.message=messages[error.name]||'收音未能启动，请检查浏览器权限及输入设备后重试。';syncAudioUI();drawScene();
 }
}
function sampleMicrophone(dt=1/60){
 if(!mic.analyser||!mic.buffer)return;
 mic.analyser.getFloatTimeDomainData(mic.buffer);
 const gain=state.params.audio.gain;
 const mean=mic.buffer.reduce((sum,x)=>sum+x,0)/mic.buffer.length;
 const rms=Math.sqrt(mic.buffer.reduce((sum,x)=>sum+(x-mean)*(x-mean),0)/mic.buffer.length);
 const rawBands=readFrequencyBands();
 if(mic.calibrating){
  rawBands.forEach((v,i)=>mic.bandSum[i]+=v);mic.bandSamples++;
  mic.calibration.push(rms);mic.calibrationTime+=dt;mic.level=0;
  if(mic.calibrationTime>=1.2){
   const samples=mic.calibration.slice().sort((a,b)=>a-b);
   mic.floor=Math.max(.006,samples[Math.floor(samples.length*.3)]*1.7+.003);
   mic.bandFloor=mic.bandSum.map(v=>Math.min(.95,v/Math.max(1,mic.bandSamples)*1.05+.025));
   mic.calibrating=false;mic.message='正在收音 · '+(mic.stream?.getAudioTracks()[0]?.label||'所选设备')+' · 静音已校准';
   if(/todesk|virtual|虚拟/i.test(mic.stream?.getAudioTracks()[0]?.label||''))mic.message+=' · 当前是虚拟设备，可在上方切换实际麦克风';
   syncAudioUI();
  }return;
 }
 mic.gate=rms>(mic.gate?mic.floor:mic.floor*1.25);
 const target=mic.gate?Math.min(60,Math.max(0,rms-mic.floor)*100*gain):0;
 const tau=target>mic.level?.08:.18;
 mic.level+=(target-mic.level)*(1-Math.exp(-Math.max(0,dt)/tau));
 if(mic.level<.1)mic.level=0;
 for(let i=0;i<13;i++){
  const target=mic.gate?Math.min(1,Math.max(0,rawBands[i]-mic.bandFloor[i])/(1-mic.bandFloor[i])*Math.sqrt(gain/6)):0;
  mic.bands[i]+=(target-mic.bands[i])*(1-Math.exp(-Math.max(0,dt)/(target>mic.bands[i]?.055:.2)));
  if(mic.bands[i]<.003)mic.bands[i]=0;
 }
 mic.wave=Array.from({length:128},(_,i)=>mic.buffer[Math.floor(i*(mic.buffer.length-1)/127)]*gain);
}
function calibrateMicrophone(){
 if(mic.status!=='live')return;
 mic.calibrating=true;mic.calibration=[];mic.calibrationTime=0;mic.level=0;mic.gate=false;
 mic.bands.fill(0);mic.bandSum.fill(0);mic.bandSamples=0;
 mic.message='正在校准静音 · 请保持安静约 1 秒，然后开始说话。';syncAudioUI();
}
function frequencyBandLevels(bytes,sampleRate,fftSize){
 const high=Math.min(8000,sampleRate/2),low=Math.min(80,high/2),binHz=sampleRate/fftSize;
 return Array.from({length:13},(_,i)=>{
  const start=Math.max(1,Math.min(bytes.length-1,Math.floor(low*Math.pow(high/low,i/13)/binHz)));
  const end=Math.max(start+1,Math.min(bytes.length,Math.ceil(low*Math.pow(high/low,(i+1)/13)/binHz)));
  let energy=0;for(let b=start;b<end;b++)energy+=(bytes[b]/255)**2;
  return Math.sqrt(energy/(end-start));
 });
}
function readFrequencyBands(){
 if(!mic.spectrum||!mic.analyser?.getByteFrequencyData)return Array(13).fill(0);
 mic.analyser.getByteFrequencyData(mic.spectrum);
 return frequencyBandLevels(mic.spectrum,mic.context?.sampleRate||48000,mic.analyser.fftSize||2048);
}
async function refreshMicrophoneDevices(token){
 try{
  if(!navigator.mediaDevices.enumerateDevices)return;
  const devices=await navigator.mediaDevices.enumerateDevices();if(token!==mic.token)return;
  mic.devices=devices.filter(d=>d.kind==='audioinput');
  const el=$('micDevice');if(!el)return;
  el.innerHTML='<option value="">系统默认</option>'+mic.devices.map(d=>`<option value="${escapeHTML(d.deviceId)}">${escapeHTML(d.label||'麦克风')}</option>`).join('');el.value=mic.deviceId;
 }catch{}
}

const followDemo={manual:false,clock:0,position:[150,175],history:[]};
function autoFollowPosition(t){t=Math.max(0,t);return [300-150*Math.cos(t*Math.PI/3),175+65*Math.sin(t*Math.PI*2/3)]}
function resetFollow(){Object.assign(followDemo,{manual:false,clock:0,position:autoFollowPosition(0),history:[]});if($('followMode'))$('followMode').textContent='自动演示 · 可拖动领头方块'}
function renderFollowControls(){return '<div class="demo-switch"><button data-action="follow-auto">自动演示</button><span id="followMode" class="follow-mode">'+(followDemo.manual?'实时跟随 · 松开后继续追随':'自动演示 · 可拖动领头方块')+'</span></div>'}
function advanceFollow(dt){
 followDemo.clock+=dt;
 if(followDemo.manual){followDemo.history.push([followDemo.clock,...followDemo.position]);while(followDemo.history.length>2&&followDemo.history[1][0]<followDemo.clock-3)followDemo.history.shift()}
}
function historyPosition(history,time){
 if(!history.length)return [150,175];
 if(time<history[0][0])return history[0].slice(1);
 for(let i=1;i<history.length;i++)if(history[i][0]>time){const a=history[i-1],b=history[i],u=(time-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],u),mix(a[2],b[2],u)]}
 return history[history.length-1].slice(1);
}
function followScene(p,t){
 const demo=p.followState,time=demo?demo.clock:t;
 const at=tt=>demo?.manual?historyPosition(demo.history,tt):autoFollowPosition(tt);
 let svg=svgText(300,65,'领头先动 · 跟随层读取较早的位置',palette.muted,13);
 for(let i=4;i>=1;i--){const [x,y]=at(time-i*p.delay);svg+=actor(x,y,{size:30,color:palette.purple,label:String(i),opacity:1-i*.12,id:'follower-'+i})}
 const [x,y]=demo?.manual?demo.position:at(time);
 svg+='<g data-follow-handle class="path-handle" tabindex="0" role="button" aria-label="领头方块 LEADER，拖动或方向键移动">'+actor(x,y,{size:38,color:palette.green,label:'L',id:'leader'})+'</g>'+svgText(x,y-29,'LEADER',palette.green,11)+svgText(300,299,'第 1 层 '+fmt(p.delay)+' s → 第 4 层 '+fmt(p.delay*4)+' s',palette.muted,13);
 return {svg,label:'延迟跟随 · DELAY',value:fmt(p.delay)+' s / 层 · 4 个跟随层'};
}
function bindFollow(){
 if(state.current!=='follow')return;const svg=$('scene');let dragging=false,offset=[0,0];
 const coord=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
 const begin=()=>{if(followDemo.manual)return;followDemo.history=[];for(let i=180;i>=0;i--){const t=followDemo.clock-i/60;followDemo.history.push([t,...autoFollowPosition(t)])}followDemo.position=autoFollowPosition(followDemo.clock);followDemo.manual=true};
 const set=(x,y)=>{begin();followDemo.position=[Math.max(50,Math.min(550,x)),Math.max(110,Math.min(250,y))];followDemo.history.push([followDemo.clock,...followDemo.position]);drawScene();if($('followMode'))$('followMode').textContent='实时跟随 · 松开后继续追随'};
 svg.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-follow-handle]'))return;begin();const p=coord(e);offset=[p.x-followDemo.position[0],p.y-followDemo.position[1]];dragging=true;svg.setPointerCapture(e.pointerId);state.playing=true;schedule();e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!dragging)return;const p=coord(e);set(p.x-offset[0],p.y-offset[1])});
 for(const n of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(n,()=>dragging=false);
 svg.addEventListener('keydown',e=>{if(!e.target.closest('[data-follow-handle]')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();begin();const step=e.shiftKey?20:5;set(followDemo.position[0]+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),followDemo.position[1]+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0));svg.querySelector('[data-follow-handle]').focus()});
}
function textBoxGeometry(r,p){
 const x=r.x-p.padX,y=r.y-p.padY,w=r.width+2*p.padX,h=r.height+2*p.padY;
 const radius=p.radiusMode==='auto'?Math.min(w,h)/2*p.radiusRatio/100:Math.min(p.radius,w/2,h/2);
 const side=p.tailSide==='left'?-1:1,edge=x+w/2+side*w/2,cy=y+Math.max(radius,Math.min(h-radius,p.padY+14));
 const a=Math.min(7,h/4),overlap=Math.max(1,radius-Math.sqrt(Math.max(0,radius*radius-a*a)));
 const base=edge-side*Math.min(overlap,w/2);
 const tail=[[base,cy-a],[edge+side*8,cy],[base,cy+a]];
 return {x,y,w,h,radius,tail};
}
function textBoxScene(p){
 const lines=String(p.text).replace(/\r\n?/g,'\n').split('\n');
 const width=Math.max(0,...lines.map(s=>[...s].reduce((n,c)=>n+(/[\u0000-\u007f]/.test(c)?13:24),0)));
 const r={x:0,y:p.text?-24:0,width,height:p.text?28+(lines.length-1)*34:0};
 const g=textBoxGeometry(r,p),bubble=p.boxStyle==='bubble';
 const fill=bubble?'#2DCD8D':'none',color=bubble?'#102820':'#ece8f5';
 const s=Math.min(1,480/Math.max(1,g.w+(bubble?8:0)),200/Math.max(1,g.h));
 const svg=`<g data-text-layout transform="translate(${300-(g.x+g.w/2)*s} ${177-(g.y+g.h/2)*s}) scale(${s})"><path data-text-tail d="M${g.tail.map(pt=>pt.join(',')).join(' L')} Z" fill="#2DCD8D" ${bubble?'':'display="none"'}/><rect data-text-bg x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="${g.radius}" fill="${fill}" stroke="${bubble?'none':palette.purple}" stroke-width="1.25"/><text data-box-text x="0" y="0" font-size="24" xml:space="preserve" fill="${color}">${lines.map((s,i)=>`<tspan x="0" y="${i*34}">${escapeHTML(s)}</tspan>`).join('')}</text></g>`;
 return {svg,label:bubble?'聊天气泡 · CHAT BUBBLE':'文字边框 · TEXT FRAME',value:lines.length+' 行 · 留白 '+p.padX+' / '+p.padY+' px'};
}
function fitTextBackground(svg,p){
 const text=svg.querySelector('[data-box-text]');if(!text?.getBBox)return;
 const r=text.getBBox(),g=textBoxGeometry(r,p),bubble=p.boxStyle==='bubble';
 const left=g.x-(bubble&&p.tailSide==='left'?8:0),width=g.w+(bubble?8:0);
 const s=Math.min(1,480/Math.max(1,width),200/Math.max(1,g.h));
 const set=(selector,attrs)=>{const el=svg.querySelector(selector);if(el)for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v)};
 set('[data-text-bg]',{x:g.x,y:g.y,width:g.w,height:g.h,rx:g.radius});
 set('[data-text-tail]',{d:'M'+g.tail.map(pt=>pt.join(',')).join(' L')+' Z'});
 set('[data-text-layout]',{transform:'translate('+(300-(left+width/2)*s)+' '+(177-(g.y+g.h/2)*s)+') scale('+s+')'});
}
